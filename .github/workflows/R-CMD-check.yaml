# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-latest,   r: '4.1.3'}
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: '4.1.3'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: '4.1.3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install R 4.1 ARM Fortran toolchain
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.config.r == '4.1.3'
        shell: bash
        run: |
          # R 4.1 ARM uses GCC 11 under /opt/R/arm64; setup-r installs the
          # legacy Intel compiler for R < 4.3, which cannot link ARM packages.
          archive="$RUNNER_TEMP/gfortran-r41-arm64.tar.gz"
          curl --fail --location --retry 3 \
            https://mac.r-project.org/libs-arm64/gfortran-f51f1da0-darwin20.0-arm64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            e7a5272fcbe002e9e22effc18bba01c352ca95f63dc3264865d9f8020ac55821 \
            "$archive" | shasum -a 256 --check
          sudo tar -xzf "$archive" -C /
          /opt/R/arm64/bin/gfortran --version

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # eatRep needs Hmisc, pbkrtest and Matrix versions compatible with R 4.1.
          # Pin through a manifest to avoid installing their own Suggests.
          # Keep all eatPrep dependencies and JK2 tests on R 4.1.3.
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.r == '4.1.3' && 'deps::.github/r-4.1.3' || '' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
